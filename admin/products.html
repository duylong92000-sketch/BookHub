<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Quản lý sản phẩm - BookHub</title>

    <link rel="stylesheet" href="../css/admin.css">

</head>


<body>
    <aside class="sidebar">

        <div class="logo">

            <h2>BookHub</h2>

            <p>Admin</p>

        </div>


        <nav>

            <a href="dashboard.html">
                Dashboard
            </a>

            <a href="product.html"
               class="active">
                Quản lý sản phẩm
            </a>

            <a href="categories.html">
                Quản lý danh mục
            </a>

            <a href="customers.html">
                Quản lý khách hàng
            </a>

            <a href="orders.html">
                Quản lý đơn hàng
            </a>

            <a href="import.html">
                Nhập hàng
            </a>

            <a href="inventory.html">
                Kho hàng
            </a>

            <a href="prices.html">
                Quản lý giá
            </a>

        </nav>

    </aside>


    <!-- MAIN -->

    <main class="admin-main">


        <!-- HEADER -->

        <header class="admin-header">

            <div>

                <h1>Quản lý sản phẩm</h1>

                <p>
                    Thêm, sửa, xóa và quản lý sách
                </p>

            </div>


            <div class="admin-user">
                Admin
            </div>

        </header>



        <!-- TOOLBAR -->

        <section class="admin-section">

            <div class="toolbar">

                <input
                    type="text"
                    id="searchProduct"
                    placeholder="Tìm kiếm sản phẩm..."
                >


                <select id="filterCategory">

                    <option value="">
                        Tất cả danh mục
                    </option>

                </select>


                <button
                    class="btn btn-primary"
                    onclick="openProductForm()">

                    + Thêm sản phẩm

                </button>

            </div>

        </section>



        <!-- PRODUCT TABLE -->

        <section class="admin-section">

            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>Mã SP</th>

                            <th>Ảnh</th>

                            <th>Tên sách</th>

                            <th>Danh mục</th>

                            <th>Giá nhập</th>

                            <th>% LN</th>

                            <th>Giá bán</th>

                            <th>Tồn kho</th>

                            <th>Trạng thái</th>

                            <th>Thao tác</th>

                        </tr>

                    </thead>


                    <tbody id="productTableBody">

                    </tbody>

                </table>

            </div>

        </section>



    </main>



    <!-- MODAL -->

    <div
        id="productModal"
        class="modal">


        <div class="modal-content">


            <div class="modal-header">

                <h2 id="formTitle">
                    Thêm sản phẩm
                </h2>

                <button
                    class="close-btn"
                    onclick="closeProductForm()">

                    ×

                </button>

            </div>



            <form
                id="productForm"
                onsubmit="saveProduct(event)">


                <input
                    type="hidden"
                    id="productId">


                <div class="form-group">

                    <label>
                        Tên sách
                    </label>

                    <input
                        type="text"
                        id="productName"
                        required>

                </div>



                <div class="form-row">

                    <div class="form-group">

                        <label>
                            Danh mục
                        </label>

                        <select
                            id="categoryId"
                            required>

                        </select>

                    </div>


                    <div class="form-group">

                        <label>
                            Tác giả
                        </label>

                        <input
                            type="text"
                            id="author"
                            required>

                    </div>

                </div>



                <div class="form-row">

                    <div class="form-group">

                        <label>
                            Nhà xuất bản
                        </label>

                        <input
                            type="text"
                            id="publisher">

                    </div>


                    <div class="form-group">

                        <label>
                            ISBN
                        </label>

                        <input
                            type="text"
                            id="isbn">

                    </div>

                </div>



                <div class="form-group">

                    <label>
                        Hình ảnh
                    </label>

                    <input
                        type="text"
                        id="image"
                        placeholder="dac-nhan-tam.jpg">

                </div>



                <div class="form-row">

                    <div class="form-group">

                        <label>
                            Giá nhập
                        </label>

                        <input
                            type="number"
                            id="importPrice"
                            min="0"
                            required>

                    </div>


                    <div class="form-group">

                        <label>
                            % lợi nhuận
                        </label>

                        <input
                            type="number"
                            id="profitRate"
                            min="0"
                            value="30"
                            required>

                    </div>

                </div>



                <div class="form-row">

                    <div class="form-group">

                        <label>
                            Giá bán
                        </label>

                        <input
                            type="number"
                            id="salePrice"
                            readonly>

                    </div>


                    <div class="form-group">

                        <label>
                            Số lượng tồn kho
                        </label>

                        <input
                            type="number"
                            id="stockQuantity"
                            min="0"
                            value="0"
                            required>

                    </div>

                </div>



                <div class="form-group">

                    <label>
                        Mô tả
                    </label>

                    <textarea
                        id="description"
                        rows="4"></textarea>

                </div>



                <div class="form-group">

                    <label>
                        Trạng thái
                    </label>

                    <select id="status">

                        <option value="active">
                            Đang bán
                        </option>

                        <option value="inactive">
                            Ngừng bán
                        </option>

                    </select>

                </div>



                <div class="form-actions">

                    <button
                        type="button"
                        class="btn"
                        onclick="closeProductForm()">

                        Hủy

                    </button>


                    <button
                        type="submit"
                        class="btn btn-primary">

                        Lưu sản phẩm

                    </button>

                </div>


            </form>


        </div>

    </div>



    <script src="../js/admin.js"></script>

</body>

</html>
