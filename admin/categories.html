<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Quản lý danh mục - BookHub</title>

    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/admin-extra.css">
</head>

<body>

    <header class="admin-header">
        <div class="logo">
            <h2>BookHub Admin</h2>
        </div>

        <nav class="admin-nav">
            <a href="dashboard.html" class="active">Dashboard</a>
            <a href="products.html">Sản phẩm</a>
            <a href="categories.html">Danh mục</a>
            <a href="customers.html">Khách hàng</a>
            <a href="orders.html">Đơn hàng</a>
            <a href="import.html">Nhập hàng</a>
            <a href="inventory.html">Tồn kho</a>
            <a href="prices.html">Giá bán</a>
        </nav>
    </header>


    <!-- MAIN -->
    <main class="admin-main">

        <header class="admin-header">

            <div>

                <h1>Quản lý danh mục</h1>

                <p>
                    Thêm, sửa và quản lý danh mục sách
                </p>

            </div>

            <div class="admin-user">
                Admin
            </div>

        </header>


        <!-- TOOLBAR -->
        <section class="admin-section">

            <div class="toolbar">

                <input
                    type="text"
                    id="searchCategory"
                    placeholder="Tìm kiếm danh mục..."
                >

                <button
                    class="btn btn-primary"
                    onclick="openCategoryForm()">

                    + Thêm danh mục

                </button>

            </div>

        </section>


        <!-- TABLE -->
        <section class="admin-section">

            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>Mã danh mục</th>

                            <th>Tên danh mục</th>

                            <th>Số sản phẩm</th>

                            <th>Trạng thái</th>

                            <th>Thao tác</th>

                        </tr>

                    </thead>

                    <tbody id="categoryTableBody"></tbody>

                </table>

            </div>

        </section>

    </main>


    <!-- MODAL -->
    <div id="categoryModal" class="modal">

        <div class="modal-content">

            <div class="modal-header">

                <h2 id="categoryFormTitle">
                    Thêm danh mục
                </h2>

                <button class="close-btn" onclick="closeCategoryForm()">
                    ×
                </button>

            </div>


            <form
                id="categoryForm"
                onsubmit="saveCategory(event)">

                <input
                    type="hidden"
                    id="categoryId">


                <div class="form-group">

                    <label>
                        Tên danh mục
                    </label>

                    <input
                        type="text"
                        id="categoryName"
                        required>

                </div>


                <div class="form-group">

                    <label>
                        Trạng thái
                    </label>

                    <select id="categoryStatus">

                        <option value="active">
                            Đang hoạt động
                        </option>

                        <option value="inactive">
                            Ngừng hoạt động
                        </option>

                    </select>

                </div>


                <div class="form-actions">

                    <button
                        type="button"
                        class="btn"
                        onclick="closeCategoryForm()">

                        Hủy

                    </button>

                    <button
                        type="submit"
                        class="btn btn-primary">

                        Lưu danh mục

                    </button>

                </div>

            </form>

        </div>

    </div>


    <script src="../js/admin.js"></script>

</body>

</html>
