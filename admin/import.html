<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Nhập hàng - BookHub</title>

    <link rel="stylesheet"
          href="../css/admin.css">

    <link rel="stylesheet"
          href="../css/admin-extra.css">

</head>


<body>

    <header class="admin-header">
        <div class="logo">
            <h2>BookHub Admin</h2>
        </div>

        <nav class="admin-nav">
            <a href="dashboard.html" class="active">Dashboard</a>
            <a href="products.html">Sản phẩm</a>
            <a href="categories.html">Danh mục</a>
            <a href="customers.html">Khách hàng</a>
            <a href="orders.html">Đơn hàng</a>
            <a href="import.html">Nhập hàng</a>
            <a href="inventory.html">Tồn kho</a>
            <a href="prices.html">Giá bán</a>
        </nav>
    </header>

    <main class="admin-main">


        <header class="admin-header">

            <div>

                <h1>Quản lý nhập hàng</h1>

                <p>
                    Lập phiếu nhập và cập nhật tồn kho
                </p>

            </div>


            <div class="admin-user">
                Admin
            </div>

        </header>



        <section class="admin-section">

            <div class="toolbar">

                <input
                    type="date"
                    id="importDate">


                <button
                    class="btn btn-primary"
                    onclick="openImportForm()">

                    + Tạo phiếu nhập

                </button>

            </div>

        </section>



        <section class="admin-section">

            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>Mã phiếu</th>

                            <th>Ngày nhập</th>

                            <th>Số mặt hàng</th>

                            <th>Tổng tiền</th>

                            <th>Trạng thái</th>

                            <th>Thao tác</th>

                        </tr>

                    </thead>


                    <tbody id="importTableBody">

                    </tbody>

                </table>

            </div>

        </section>

    </main>



    <!-- MODAL -->

    <div
        id="importModal"
        class="modal">


        <div class="modal-content">


            <div class="modal-header">

                <h2>
                    Tạo phiếu nhập
                </h2>

                <button
                    class="close-btn"
                    onclick="closeImportForm()">

                    ×

                </button>

            </div>



            <form
                id="importForm"
                onsubmit="saveImport(event)">


                <div class="form-group">

                    <label>
                        Ngày nhập
                    </label>

                    <input
                        type="date"
                        id="newImportDate"
                        required>

                </div>



                <div class="form-group">

                    <label>
                        Sản phẩm
                    </label>

                    <select
                        id="importProductId"
                        required>

                    </select>

                </div>



                <div class="form-row">

                    <div class="form-group">

                        <label>
                            Số lượng
                        </label>

                        <input
                            type="number"
                            id="importQuantity"
                            min="1"
                            required>

                    </div>


                    <div class="form-group">

                        <label>
                            Giá nhập
                        </label>

                        <input
                            type="number"
                            id="newImportPrice"
                            min="0"
                            required>

                    </div>

                </div>



                <div class="form-actions">

                    <button
                        type="button"
                        class="btn"
                        onclick="closeImportForm()">

                        Hủy

                    </button>


                    <button
                        type="submit"
                        class="btn btn-primary">

                        Lưu phiếu nhập

                    </button>

                </div>


            </form>

        </div>

    </div>



    <script src="../js/admin.js"></script>

</body>

</html>
