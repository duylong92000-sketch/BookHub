<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Quản lý giá - BookHub</title>

    <link rel="stylesheet"
          href="../css/admin.css">

    <link rel="stylesheet"
          href="../css/admin-extra.css">

</head>


<body>

    <header class="admin-header">
        <div class="logo">
            <h2>BookHub Admin</h2>
        </div>

        <nav class="admin-nav">
            <a href="dashboard.html" class="active">Dashboard</a>
            <a href="products.html">Sản phẩm</a>
            <a href="categories.html">Danh mục</a>
            <a href="customers.html">Khách hàng</a>
            <a href="orders.html">Đơn hàng</a>
            <a href="import.html">Nhập hàng</a>
            <a href="inventory.html">Tồn kho</a>
            <a href="prices.html">Giá bán</a>
        </nav>
    </header>

    <main class="admin-main">


        <header class="admin-header">

            <div>

                <h1>Quản lý giá</h1>

                <p>
                    Cập nhật giá nhập và giá bán
                </p>

            </div>


            <div class="admin-user">
                Admin
            </div>

        </header>



        <section class="admin-section">

            <div class="toolbar">

                <input
                    type="text"
                    id="searchPrice"
                    placeholder="Tìm kiếm sản phẩm...">

            </div>

        </section>



        <section class="admin-section">

            <div class="table-container">

                <table>

                    <thead>

                        <tr>

                            <th>Mã SP</th>

                            <th>Tên sách</th>

                            <th>Giá nhập</th>

                            <th>Lợi nhuận (%)</th>

                            <th>Giá bán</th>

                            <th>Thao tác</th>

                        </tr>

                    </thead>


                    <tbody id="priceTableBody">

                    </tbody>

                </table>

            </div>

        </section>

    </main>



    <!-- MODAL -->

    <div
        id="priceModal"
        class="modal">


        <div class="modal-content">


            <div class="modal-header">

                <h2>
                    Cập nhật giá
                </h2>

                <button
                    class="close-btn"
                    onclick="closePriceForm()">

                    ×

                </button>

            </div>



            <form
                id="priceForm"
                onsubmit="savePrice(event)">


                <input
                    type="hidden"
                    id="priceProductId">


                <div class="form-group">

                    <label>
                        Tên sản phẩm
                    </label>

                    <input
                        type="text"
                        id="priceProductName"
                        readonly>

                </div>



                <div class="form-row">

                    <div class="form-group">

                        <label>
                            Giá nhập
                        </label>

                        <input
                            type="number"
                            id="priceImport"
                            min="0"
                            required>

                    </div>


                    <div class="form-group">

                        <label>
                            Tỷ lệ lợi nhuận (%)
                        </label>

                        <input
                            type="number"
                            id="priceProfit"
                            min="0"
                            required>

                    </div>

                </div>



                <div class="form-group">

                    <label>
                        Giá bán
                    </label>

                    <input
                        type="number"
                        id="priceSale"
                        readonly>

                </div>



                <div class="form-actions">

                    <button
                        type="button"
                        class="btn"
                        onclick="closePriceForm()">

                        Hủy

                    </button>


                    <button
                        type="submit"
                        class="btn btn-primary">

                        Cập nhật giá

                    </button>

                </div>


            </form>

        </div>

    </div>



    <script src="../js/admin.js"></script>

</body>

</html>
