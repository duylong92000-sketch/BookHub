<!DOCTYPE html>
<html lang="vi">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>BookHub - Giá bán</title>

    <link rel="stylesheet" href="../css/admin.css">

</head>

<body>

<header class="admin-header">

    <div class="admin-logo">
        <h2>BookHub Admin</h2>
    </div>

    <nav class="admin-nav">

        <a href="dashboard.html">Dashboard</a>
        <a href="product.html">Sản phẩm</a>
        <a href="categories.html">Danh mục</a>
        <a href="customers.html">Khách hàng</a>
        <a href="orders.html">Đơn hàng</a>
        <a href="import.html">Nhập hàng</a>
        <a href="inventory.html">Tồn kho</a>
        <a href="prices.html" class="active">Giá bán</a>

    </nav>

    <div class="admin-user">
        <span>Admin</span>
        <a href="login.html" class="logout-link">Đăng xuất</a>
    </div>

</header>

<main class="admin-content">

    <section class="page-heading">

        <div>
            <h1>Giá bán</h1>
            <p>Quản lý giá bán của sản phẩm</p>
        </div>

    </section>

    <section class="panel">

        <div class="toolbar">

            <input
                id="priceSearch"
                class="search-input"
                type="text"
                placeholder="Tìm sản phẩm...">

        </div>

        <div class="table-wrap">

            <table class="data-table">

                <thead>

                    <tr>

                        <th>Mã SP</th>
                        <th>Sản phẩm</th>
                        <th>Giá nhập</th>
                        <th>Lợi nhuận</th>
                        <th>Giá bán</th>
                        <th>Thao tác</th>

                    </tr>

                </thead>

                <tbody id="priceList"></tbody>

            </table>

        </div>

    </section>

</main>

<div class="modal" id="priceModal">

    <div class="modal-content">

        <div class="modal-header">

            <h2>Cập nhật giá bán</h2>

            <button
                class="close-btn"
                onclick="closePriceForm()">

                ×

            </button>

        </div>

        <form onsubmit="savePrice(event)">

            <input
                type="hidden"
                id="priceProductId">

            <div class="form-group">

                <label>Sản phẩm</label>

                <input
                    id="priceProductName"
                    readonly>

            </div>

            <div class="form-group">

                <label>Giá nhập</label>

                <input
                    type="number"
                    id="priceImport"
                    min="0"
                    required>

            </div>

            <div class="form-group">

                <label>Tỷ lệ lợi nhuận (%)</label>

                <input
                    type="number"
                    id="priceProfit"
                    min="0"
                    required>

            </div>

            <div class="total-box">

                Giá bán:
                <span id="calculatedPrice">
                    0 VNĐ
                </span>

            </div>

            <div class="form-actions">

                <button
                    type="button"
                    class="btn"
                    onclick="closePriceForm()">

                    Hủy

                </button>

                <button
                    type="submit"
                    class="btn btn-primary">

                    Lưu

                </button>

            </div>

        </form>

    </div>

</div>

<script src="../js/admin.js"></script>

</body>

</html>
