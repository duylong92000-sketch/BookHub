<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập quản trị - BookHub</title>
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/profile.css">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@600;700&display=swap">
    <style>
        .login-box .brand { text-align: center; margin-bottom: 20px; }
        .login-box .brand h1 { margin: 6px 0 4px; font-family: "Be Vietnam Pro", Arial, sans-serif; }
        .login-box .brand p { margin: 0; }
        .login-box h2 { margin: 0 0 18px; font-size: 18px; color: var(--text); }
        .login-box .error { min-height: 18px; margin-top: 4px; color: var(--red); font-size: 13px; }
        .login-box .back-link { display: block; margin-top: 16px; text-align: center; font-size: 14px; color: var(--green); text-decoration: none; }
        .login-box .back-link:hover { text-decoration: underline; }
        .login-box input:focus-visible,
        .login-box .btn:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }
    </style>
    <script src="../js/admin-auth.js"></script>
    <script>
        // Đã đăng nhập thì vào thẳng khu vực admin
        AdminAuth.redirectIfLoggedIn();
    </script>
</head>

<body class="login-page">
    <main class="login-box">
        <div class="brand">
            <img src="../images/logoweb.png" alt="BookHub" width="50" height="50">
            <h1>BOOKHUB</h1>
            <p>Chắp cánh tri thức</p>
        </div>

        <h2>Đăng nhập quản trị</h2>

        <form id="adminLoginForm" novalidate>
            <div class="form-group">
                <label for="adminUsername">Tên tài khoản</label>
                <input type="text" id="adminUsername" autocomplete="username" placeholder="Tên tài khoản" autofocus>
                <div id="userError" class="error" role="alert"></div>
            </div>

            <div class="form-group">
                <label for="adminPassword">Mật khẩu</label>
                <input type="password" id="adminPassword" autocomplete="current-password" placeholder="Nhập mật khẩu">
                <div id="passwordError" class="error" role="alert"></div>
            </div>

            <button type="submit" class="btn btn-primary">Đăng nhập</button>
        </form>

        <a class="back-link" href="../index.html">← Về trang cửa hàng</a>
    </main>

    <script>
        (function () {
            var form = document.getElementById("adminLoginForm");
            var userInput = document.getElementById("adminUsername");
            var passInput = document.getElementById("adminPassword");
            var userError = document.getElementById("userError");
            var passError = document.getElementById("passwordError");

            form.addEventListener("submit", function (e) {
                e.preventDefault();

                var username = userInput.value.trim();
                var password = passInput.value;
                var valid = true;

                if (!username) {
                    userError.textContent = "Tên không được để trống";
                    valid = false;
                } else {
                    userError.textContent = "";
                }

                if (password.trim() === "") {
                    passError.textContent = "Mật khẩu không được để trống";
                    valid = false;
                } else {
                    passError.textContent = "";
                }

                if (!valid) return;

                if (AdminAuth.login(username, password)) {
                    passInput.value = "";
                    AdminAuth.goToAdmin();
                } else {
                    passError.textContent = "Tài khoản hoặc mật khẩu không đúng";
                    passInput.select();
                }
            });

            // Xóa thông báo lỗi khi người dùng bắt đầu sửa
            userInput.addEventListener("input", function () { userError.textContent = ""; });
            passInput.addEventListener("input", function () { passError.textContent = ""; });
        })();
    </script>
</body>
</html>
